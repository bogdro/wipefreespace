name: Makefile CI - macOS

on:
  push:
    branches: [ "master", dev, main ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    #- name: Install requirements
    #  run: |
    #    sudo apt-get update
    #    sudo apt-get -y install check libext2fs-dev ntfs-3g-dev xfsprogs libhfsp-dev ocfs2-tools-dev
    - name: Install dependencies
      run: |
        mkdir $HOME/bin || true
        ls -ld $HOME/bin || true
        ls -l $HOME || true
        chmod 700 $HOME/bin || true
        echo '#!/bin/bash' > $HOME/bin/xfs_db || true
        chmod 700 $HOME/bin/xfs_db || true
        export PATH=$PATH:$HOME/bin

    - name: Configure
      run: |
        #autoreconf --install
        touch aclocal.m4 Makefile.in src/Makefile.in doc/Makefile.in test/Makefile.in config.h.in
        for i in po/*.po; do touch ${i/.po/.gmo}; done
        sleep 1
        touch configure
        sleep 1
        ./configure
        sleep 1
        touch doc/wipefreespace.info
        sleep 1

    - name: Build
      run: make

    #- name: Test
    #  run: make check || cat test/test-suite.log || cat test/*.log

    #- name: Run distcheck
    #  run: make distcheck
